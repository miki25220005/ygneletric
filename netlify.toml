[build]
  publish = "."
  functions = "netlify/functions"

# Rewrites for API endpoints
[[redirects]]
  from = "/api/track"
  to = "/.netlify/functions/track"
  status = 200

[[redirects]]
  from = "/api/track.php"
  to = "/.netlify/functions/track"
  status = 200

[[redirects]]
  from = "/api/stats"
  to = "/.netlify/functions/stats"
  status = 200

[[redirects]]
  from = "/api/stats.php"
  to = "/.netlify/functions/stats"
  status = 200
